# The doc-style skill and its checker. See "Claude Code" in README.md. The tag pins the
# version; update the url and the checksum together.
[".local/share/haddock"]
type = "archive"
url = "https://github.com/throw-if-null/haddock/archive/refs/tags/v0.2.0.tar.gz"
checksum.sha256 = "1fd2c52ae73381cb44ffd62b98355d4ec135e3ab8ffb04922c3148c5833a04b1"
exact = true
stripComponents = 1
exclude = ["**/.github/**", "**/tests/**"]

# Font used by kitty. See "JetBrains Mono" in README.md.
[".local/share/fonts/JetBrainsMono"]
type = "archive"
url = "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip"
checksum.sha256 = "6f6376c6ed2960ea8a963cd7387ec9d76e3f629125bc33d1fdcd7eb7012f7bbf"
exact = true
stripComponents = 2
include = ["fonts/variable/*.ttf"]
