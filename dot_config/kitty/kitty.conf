# Font
font_family family="JetBrains Mono"
font_size 12.0
modify_font cell_height 110%
disable_ligatures cursor

# Colors
# The palettes are in dark-theme.auto.conf, light-theme.auto.conf, and
# no-preference-theme.auto.conf. kitty selects one from the GNOME color scheme.
# text_fg_override_threshold MUST NOT be set. It also changes the color of the
# half block that tab_bar.py draws at each tab edge, because the tab color and
# the tab bar background have less than 4.5:1 contrast.

# Tab bar
tab_bar_edge top
# tab_bar.py draws each tab as a rectangle with a half-cell gap.
tab_bar_style custom
active_tab_font_style bold

# Scrollback
scrollback_lines 10000

# Shell integration
shell_integration enabled

# Window behavior
confirm_os_window_close 0
remember_window_size yes
window_padding_width 4

# Cursor
cursor_shape beam
cursor_blink_interval 0
