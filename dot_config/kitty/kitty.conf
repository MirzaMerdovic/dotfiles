# Font
font_family family="JetBrains Mono"
font_size 12.0
modify_font cell_height 110%
disable_ligatures cursor

# Colors
# The palettes are in dark-theme.auto.conf, light-theme.auto.conf, and
# no-preference-theme.auto.conf. kitty selects one from the GNOME color scheme.
# Both palettes contain colors below 4.5:1 contrast, for example bright black
# in dark mode and yellow in light mode. kitty raises them to WCAG AA.
text_fg_override_threshold 4.5 ratio

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Scrollback
scrollback_lines 10000

# Shell integration
shell_integration enabled

# Window behavior
confirm_os_window_close 0
remember_window_size yes
window_padding_width 4

# Cursor
cursor_shape beam
