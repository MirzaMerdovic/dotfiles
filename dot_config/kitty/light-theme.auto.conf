# One Light terminal palette from Zed, assets/themes/one/one.json.
#
# GNOME reports the color scheme as no-preference when Dark Style is off.
# no-preference-theme.auto.conf is a symlink to this file for that reason.

foreground #2a2c33
background #fafafa
selection_foreground none
selection_background #d4dbf4
cursor #5c78e2
cursor_text_color background
url_color #2f5af3

active_tab_foreground   #fafafa
active_tab_background   #2f5af3
inactive_tab_foreground #2a2c33
inactive_tab_background #ebebec
tab_bar_background      #ebebec

