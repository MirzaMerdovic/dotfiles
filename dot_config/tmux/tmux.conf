# General
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on

# Window / pane numbering
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# Vi-style copy mode
setw -g mode-keys vi

# Better terminal behavior with Kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Terminal title, shown in the kitty tab bar
set -g set-titles on
set -g set-titles-string "#S: #W"

# Status bar
# Colors are palette names, not hex values, so they follow the kitty theme.
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
set -g status-left "#[bold] #S #[nobold]"
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#H "
setw -g window-status-format " #I:#W#{?window_zoomed_flag, (zoom),} "
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, (zoom),} "
setw -g window-status-current-style "fg=blue,bold,reverse"
setw -g window-status-separator ""

# Convenient reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
